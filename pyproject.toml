[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rjscan"
version = "0.1.0"
description = "Nmap-first RMI/JMX scanner"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Codex"}]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = []

[project.scripts]
rjscan = "rjscan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rjscan*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
